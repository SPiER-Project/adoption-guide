# SPiER FHIR Implementation Guide — Sushi configuration
#
# This IG compiles via fsh-sushi (https://fshschool.org/docs/sushi/) and is
# rendered by the HL7 IG Publisher. The output is a hostable FHIR IG site
# that complements the React companion app.
#
# Status: ci-build / draft. Not yet balloted or formally published.

id: thespierproject.fhir
# Canonical root matches the existing FHIR-Resources artifacts (Questionnaire
# url = http://thespierproject.org/fhir/Questionnaire/...) and the observationMappers code
# systems. Keep the IG and runtime data in the same namespace.
canonical: http://thespierproject.org/fhir
name: SPiER
title: The SPiER Project
status: draft
version: 0.1.0
fhirVersion: 4.0.1
copyrightYear: 2026+
releaseLabel: ci-build

description: >-
  A FHIR-native reference implementation of the suicide-safer care pathway,
  developed in alignment with the Zero Suicide framework. SPiER makes each
  layer of suicide prevention machine-actionable across three steps: Capture
  (validated instruments as FHIR Questionnaires), Translate (an
  instrument-agnostic suicide-risk concept that every tool maps into), and Act
  (PlanDefinitions and ActivityDefinitions that turn the already-settled
  response protocol into executable recommendations) — modeling the eight
  technical stages from Flag Risk through Measure and Share. The goal is to
  give EHR vendors and health systems lift-able artifacts that demonstrate
  what suicide-prevention pathway conformance looks like in practice.

license: CC0-1.0

publisher:
  name: SPiER
  url: https://htdhealth.com
  email: brad.thorson@htdhealth.com

jurisdiction: urn:iso:std:iso:3166#US "United States of America"

# US Core dependency anchors patient demographics and standard observations
# to the US realm. Add additional dependencies (e.g., SDC) as needed.
dependencies:
  hl7.fhir.us.core: 6.1.0
  # SDC: calculatedExpression (score totals) + observationExtract (declared
  # extraction contract) extensions used by the screening Questionnaires.
  hl7.fhir.uv.sdc: 3.0.0
  # CRMI and CQF Common are BOTH consequences of compiling the measure CQL, not
  # choices — nothing in the FSH references either by hand. Once a Measure has a
  # `library` pointing at compiled CQL, the publisher infers the measure's data
  # requirements, stamps a `crmi-effectiveDataRequirements` extension on the
  # Measure and contains the inferred Library inside it. Without these two the
  # publisher generates content it cannot then validate: 21 errors across the
  # seven Measures, three each, for an undefined extension and an unresolvable
  # FHIRHelpers canonical. 2.0.0 rather than 1.0.0 because its own dependency
  # pins (hl7.terminology.r4 7.x, uv.extensions.r4 5.3.0) match what this IG
  # already loads. Both are R4.
  hl7.fhir.uv.crmi: 2.0.0
  fhir.cqf.common: 4.0.1

# IG Publisher parameters
parameters:
  show-inherited-invariants: false
  apply-contact: true
  apply-jurisdiction: true
  apply-publisher: true
  # FHIR Mapping Language sources. SUSHI does not compile .fml — the IG
  # Publisher does, but only for folders it is told to scan, and the default
  # scan of input/resources does not recurse into subfolders. Naming the
  # subfolder explicitly is what makes ig/input/resources/maps/*.fml become
  # published StructureMaps (issues #92 / #229).
  path-resource:
    - input/resources/maps
  # THE CQL LOADER'S ACTIVATION SWITCH. The IG-parameters CodeSystem defines
  # path-binary as files "only used in the context of the CQL loader" — without
  # this line the publisher walks past input/cql in total silence, translating
  # nothing and saying nothing. #201 hit exactly that, read the silent log as
  # proof that the publisher cannot translate CQL at all, and moved the measure
  # CQL out of the build; #212 re-tested and found the capability had been there
  # the whole time. With it set the log reads "Translating CQL source in folder
  # …/input/cql", and the first compile immediately failed on five real defects.
  path-binary:
    - input/cql

# Pages and menu structure
pages:
  index.md:
    title: Home
  getting-started.md:
    title: Getting Started
  how-to-read.md:
    title: How to Read This Guide
  relationship-to-other-igs.md:
    title: Relationship to Other IGs
  conformance.md:
    title: Conformance
  quick-starts.md:
    title: Quick Starts
  zero-suicide-mapping.md:
    title: Zero Suicide ↔ SPiER mapping
  care-pathway.md:
    title: Care Pathway
  measurement.md:
    title: Measurement (Stage 8)

# Information architecture mirrors HL7 US Core (Home · Getting Started ·
# Guidance · Conformance · Quick Starts · Artifacts) so adopters meet a familiar
# layout. `artifacts.html` is generated by the IG Publisher; the page itself is
# not in `pagecontent/`, which is why `check-ig-menu.mjs` allowlists it.
#
# US Core also carries a Downloads entry and this IG deliberately does not:
# `fhir.base.template#current` emits no `downloads.html` (that is a US Core
# template convention), so declaring one here would render a broken link. The
# package is still published — `package.tgz` and `full-ig.zip` sit at the IG
# root — and `getting-started.md` is where readers are pointed at it.
#
# ⚠️ `how-to-read.md` restates this block in prose. `scripts/check-ig-menu.mjs`
# holds the two together (#409); change them in the same commit.
#
# ⚠️ AND a page needs BOTH blocks. `menu:` makes it reachable; `pages:` above is
# what makes the publisher render it. A menu entry whose page is missing from
# `pages:` is not one broken link — the menu is on every rendered page, so it is
# one per page: adding `care-pathway.html` to `menu:` alone took the IG from 0 to
# **1812** broken links, with 0 errors and a clean SUSHI run. `check-ig-menu.mjs`
# check D now compares the two blocks in both directions.
menu:
  Home: index.html
  Getting Started: getting-started.html
  Guidance:
    How to Read This Guide: how-to-read.html
    Relationship to Other IGs: relationship-to-other-igs.html
    Zero Suicide ↔ SPiER mapping: zero-suicide-mapping.html
    Care Pathway: care-pathway.html
    Measurement (Stage 8): measurement.html
  Conformance: conformance.html
  Quick Starts: quick-starts.html
  Artifacts: artifacts.html
