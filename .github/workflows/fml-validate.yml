name: FML — StructureMap compile + transform parity

# Gates SPiER's FHIR Mapping Language sources: every `.fml` compiles, and the
# one map with a TypeScript twin still produces the same CarePlan the runtime
# does. The logic lives in `scripts/check-fml.mjs`; read its header for what
# each phase covers.
#
# ─── The "best-effort flags" caveat this replaces ───────────────────────────
#
# Until 2026-08-08 this workflow ran the validator inline and carried a note
# saying the `-compile` invocation was "best-effort and may need a one-time
# tweak on the first CI run; adjust here once confirmed". It was never
# confirmed, and the flags were wrong in three compounding ways — see the
# header of scripts/check-fml.mjs. The net effect: the job had been green since
# 2026-06-06 while compiling nothing, because the validator prints
# "Successfully compiled" and exits 0 after failing to locate the map.
#
# The run history looked like evidence and was not. Of the eight runs on
# 2026-06-06, the seven green ones all logged `Unable to locate map`, and the
# single red one (27072266152) was a SocketException reaching tx.fhir.org —
# proof that the job can fail, not that the check can detect a bad map. The
# fix for that flake, `-tx n/a`, is kept for the compile phase.
#
# So this workflow now asserts on the validator's *output artifact* rather than
# its exit code, and the four defect classes it claims to catch — a syntax
# error, an R5-style header, a name/filename mismatch, and a map whose output
# no longer matches its golden CarePlan — were each planted and observed to
# fail before this was committed.
#
# ─── Why the parity phase needs the network ─────────────────────────────────
#
# The FML transform engine refuses to run without a terminology server
# ("Must provide a terminology server when doing a transform"), so that half
# cannot be offline-reproducible. It runs here rather than in `npm run verify`,
# the same treatment `check:codings` gets. The offline half of the same
# contract — the runtime mapper against the same golden file — is asserted by
# web/src/lib/carePlanMappers/stanleyBrown.parity.test.ts in `verify`.
#
# ─── What this does NOT cover ───────────────────────────────────────────────
#
# `validator_cli … compile` is a parser, not a profile checker. Wrong element
# names, untypeable FHIRPath and wrongly-typed `import` targets all compile
# clean and are caught only by the full IG Publisher run (`ig-publish.yml`),
# which triggers on `ig/input/**` and therefore also sees changes to these
# maps. A green run here is necessary, not sufficient.

on:
  push:
    branches:
      - main
    paths:
      - 'ig/input/resources/maps/**'
      - 'ig/drafts/**.fml'
      - 'scripts/check-fml.mjs'
      - 'scripts/lib/validator-jar.mjs'
      - 'scripts/lib/careplan-parity.mjs'
      - 'scripts/fixtures/stanley-brown/**'
      - '.github/workflows/fml-validate.yml'
  pull_request:
    paths:
      - 'ig/input/resources/maps/**'
      - 'ig/drafts/**.fml'
      - 'scripts/check-fml.mjs'
      - 'scripts/lib/validator-jar.mjs'
      - 'scripts/lib/careplan-parity.mjs'
      - 'scripts/fixtures/stanley-brown/**'
      - '.github/workflows/fml-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

# ⚠️ Conditional, not `true`. This workflow triggers on `push` to main as well
# as on PRs, and cancelling a main run leaves a MERGED commit with no verdict —
# indistinguishable from "still running". Same reasoning as web-lint.yml and
# ig.yml. (ig-publish.yml keeps a bare `true` correctly: it has no push trigger,
# so it can only ever cancel a PR run.)
concurrency:
  group: fml-validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .github/.nvmrc

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Pinned deliberately (E2b, docs/plans/repo-and-package-boundaries.md
      # §9.7) — scraped from the same constant scripts/lib/sushi-version.mjs's own
      # npx call uses, so CI and a local `npm run copy-fhir` never disagree.
      # ig.yml, ig-publish.yml, deploy.yml and terminology-nightly.yml scrape
      # the same line.
      - name: Read pinned sushi version
        id: sushi
        run: |
          version=$(sed -n "s/^export const SUSHI_VERSION = '\(.*\)'$/\1/p" scripts/lib/sushi-version.mjs)
          if [ -z "$version" ]; then
            echo "::error::could not read SUSHI_VERSION from scripts/lib/sushi-version.mjs"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install SUSHI
        run: npm install -g fsh-sushi@${{ steps.sushi.outputs.version }}

      # SUSHI downloads hl7.fhir.uv.tools.r4, hl7.terminology.r4 (4176
      # resources), us.core and uv.sdc from packages.fhir.org on every cold run,
      # and that fetch — not the compile — is the bulk of `copy-fhir`'s 40s.
      # Same key and path the ig.yml, ig-publish.yml and deploy.yml jobs already
      # use, so a PR restores what the last push to main saved.
      #
      # Safe to reuse rather than re-fetch: SUSHI still resolves the two
      # `#latest` automatic dependencies over the network each run and only
      # reads the cached copy when the concrete version matches, so a warm cache
      # cannot silently pin an older package than a cold one would.
      - name: Cache FHIR package cache
        uses: actions/cache@v4
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ hashFiles('ig/sushi-config.yaml') }}
          restore-keys: |
            fhir-packages-

      # The maps resolve the ConceptMaps they translate through out of the
      # generated resources, so the FSH has to be compiled first.
      - name: Compile FSH
        working-directory: ./ig
        run: sushi .

      # Keyed on the VERSION parsed out of scripts/lib/validator-jar.mjs, not on
      # a hash of the file — the same key ig.yml and terminology-nightly.yml use
      # for the same `.fhir-validator` path. Hashing the file made this a second,
      # divergent entry for the identical ~190MB jar: two copies of it in the
      # repo's 10GB cache budget, and a cold 190MB download here whenever that
      # file changed for a reason the jar does not care about — a comment edit, or
      # #92/#229 moving VALIDATOR_VERSION into it. Sharing the key means the three
      # gates also demonstrably judge resources with the same validator bytes.
      #
      # The empty-version guard is load-bearing for the same reason it is in
      # ig.yml: a failed parse must fail the step, not silently key the cache on
      # the empty string.
      - name: Read pinned validator version
        id: validator
        run: |
          version=$(sed -n "s/^export const VALIDATOR_VERSION = '\(.*\)'$/\1/p" scripts/lib/validator-jar.mjs)
          if [ -z "$version" ]; then
            echo "::error::could not read VALIDATOR_VERSION from scripts/lib/validator-jar.mjs"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache validator jar
        uses: actions/cache@v4
        with:
          path: .fhir-validator
          key: fhir-validator-${{ steps.validator.outputs.version }}

      - name: Compile StructureMaps + check transform parity
        run: node scripts/check-fml.mjs --tx https://tx.fhir.org
