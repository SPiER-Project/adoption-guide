name: IG Publisher (invariants + link integrity)

# Full HL7 IG Publisher build: runs SUSHI, renders the narrative pages with
# Jekyll, checks internal links, and produces the hostable site + a QA report.
#
# This is the only check that evaluates FHIRPath invariants and narrative link
# integrity. It used to run on demand only, which meant both were first
# validated *after* merge, by the identical QA gate in deploy.yml — so an
# IG-breaking PR went green, landed on main, and then blocked the Pages deploy,
# surfacing as a silently stale site rather than a failed check. It now also
# runs on PRs that touch the IG inputs or config.
#
# It is HEAVY (publisher jar + hundreds of MB of FHIR packages, plus Jekyll), so
# the FHIR package cache and the jar are cached between runs, and superseded
# runs on the same ref are cancelled. The lightweight `ig.yml` (SUSHI only)
# still covers every other ig/ change.
#
# The rendered site + qa.html are uploaded as an artifact so you can preview the
# IG and inspect any broken links / QA findings.
#
# NOTE ON CQL (learned in #201): this workflow is NOT a CQL compile gate, and an
# earlier revision of that PR wrongly added ig/input/cql/** here on the
# assumption that it was. The publisher run does not translate input/cql — its
# log never mentions CQL — so the trigger bought a ~10 minute job and validated
# nothing. SPiER's measure CQL therefore lives in ig/drafts/ alongside the
# StructureMap drafts, outside ig/input/, until a translator is actually proven
# in CI. Do not re-add a cql path filter here without first confirming, from a
# publisher log, that translation happens.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ig/input/**'
      - 'ig/sushi-config.yaml'
      - 'ig/ig.ini'
      - '.github/workflows/ig-publish.yml'
      # Deliberately excluded — see the CQL note above. input/cql is not
      # translated by the publisher, so changes confined to it would buy a
      # ~10 minute job that validates nothing. Negation must stay last: GitHub
      # applies these in order, so a PR touching both fsh/ and cql/ still runs.
      - '!ig/input/cql/**'

permissions:
  contents: read

# A new push to the same PR makes an in-flight render obsolete. Nothing here is
# deployed, so cancelling is free.
concurrency:
  group: ig-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Jekyll
        run: gem install jekyll

      - name: Install SUSHI
        run: npm install -g fsh-sushi

      # The bulk of the runtime is fetching FHIR packages (us.core, uv.sdc and
      # their transitive deps). Keyed on sushi-config.yaml because that is where
      # dependencies are declared; restore-keys lets an unrelated config edit
      # still start from the previous cache instead of a cold fetch.
      - name: Cache FHIR package cache
        uses: actions/cache@v4
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ hashFiles('ig/sushi-config.yaml') }}
          restore-keys: |
            fhir-packages-

      # Resolve the release tag explicitly so the jar can be cached by version.
      # Caching the "latest" URL would pin us to a stale publisher indefinitely.
      - name: Resolve IG Publisher release
        id: pub
        run: |
          tag=$(curl -sL https://api.github.com/repos/HL7/fhir-ig-publisher/releases/latest | jq -r .tag_name)
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "::error::could not resolve the latest fhir-ig-publisher release tag"
            exit 1
          fi
          echo "resolved publisher release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Cache IG Publisher jar
        id: jar
        uses: actions/cache@v4
        with:
          path: publisher.jar
          key: ig-publisher-${{ steps.pub.outputs.tag }}

      - name: Download IG Publisher
        if: steps.jar.outputs.cache-hit != 'true'
        run: curl -sL -o publisher.jar "https://github.com/HL7/fhir-ig-publisher/releases/download/${{ steps.pub.outputs.tag }}/publisher.jar"

      - name: Run IG Publisher
        working-directory: ./ig
        run: java -jar ../publisher.jar -ig . | tee publisher.log

      - name: QA summary report
        if: always()
        working-directory: ./ig
        run: |
          qa=output/qa.txt
          if [ ! -f "$qa" ]; then
            echo "::error::no output/qa.txt produced — the IG Publisher did not complete"
            exit 1
          fi
          # qa.txt header line format (IG Publisher 2.x): "err = N, warn = M, info = K"
          # Broken-link total is reported in the publisher log: "Broken Links: N"
          errs=$(grep -oiE 'err *= *[0-9]+' "$qa" | head -1 | grep -oE '[0-9]+')
          warns=$(grep -oiE 'warn *= *[0-9]+' "$qa" | head -1 | grep -oE '[0-9]+')
          broken=$(grep -oiE 'Broken Links: *[0-9]+' publisher.log | tail -1 | grep -oE '[0-9]+')
          echo "QA → errors=${errs:-?} warnings=${warns:-?} brokenLinks=${broken:-?}"
          {
            echo "### IG Publisher QA"
            echo ""
            echo "| Errors | Warnings | Broken links |"
            echo "|---|---|---|"
            echo "| ${errs:-?} | ${warns:-?} | ${broken:-?} |"
            echo ""
            echo "Full report (\`qa.html\`) and the rendered site are in the **ig-site** artifact."
          } >> "$GITHUB_STEP_SUMMARY"
          # Gate: fail on any IG Publisher error or broken link. The baseline is
          # 0 / 0 as of Phase 2a (#84); this guards against regressions.
          if { [ -n "$errs" ] && [ "$errs" != "0" ]; } || { [ -n "$broken" ] && [ "$broken" != "0" ]; }; then
            echo "::error::IG Publisher reported ${errs:-?} error(s) and ${broken:-?} broken link(s) — see the qa.html artifact"
            exit 1
          fi

      - name: Upload rendered site + QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ig-site
          path: |
            ig/output/qa.html
            ig/output/qa.txt
            ig/output/*.html
            ig/publisher.log
          if-no-files-found: warn
          retention-days: 14
