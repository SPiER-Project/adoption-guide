name: IG Publisher (invariants + link integrity)

# Full HL7 IG Publisher build: runs SUSHI, renders the narrative pages with
# Jekyll, checks internal links, and produces the hostable site + a QA report.
#
# This is the only check that evaluates FHIRPath invariants and narrative link
# integrity. It used to run on demand only, which meant both were first
# validated *after* merge, by the identical QA gate in deploy.yml — so an
# IG-breaking PR went green, landed on main, and then blocked the Pages deploy,
# surfacing as a silently stale site rather than a failed check. It now also
# runs on PRs that touch the IG inputs or config.
#
# It is HEAVY (publisher jar + hundreds of MB of FHIR packages, plus Jekyll), so
# the FHIR package cache and the jar are cached between runs, and superseded
# runs on the same ref are cancelled. The lightweight `ig.yml` (SUSHI only)
# still covers every other ig/ change.
#
# The rendered site + qa.html are uploaded as an artifact so you can preview the
# IG and inspect any broken links / QA findings.
#
# NOTE ON CQL: this workflow IS a CQL compile gate, as of #212 — but it only
# became one when `path-binary: input/cql` was added to ig/sushi-config.yaml.
#
# The history matters, because the obvious reading of this file was wrong for a
# release. #201 added ig/input/cql/** to this filter, saw a publisher log that
# never mentioned CQL, concluded the publisher cannot translate it, moved the
# measure CQL to ig/drafts/, and left a comment here saying so. The capability
# was there the whole time — publisher.jar bundles the full cqframework
# translator — and what was missing was the loader's activation parameter,
# which the IG-parameters CodeSystem documents as `path-binary`.
#
# #212 re-tested it and the log is unambiguous:
#
#   Translating CQL source in folder .../ig/input/cql
#   Translating CQL source in file .../SPiERSuicideSaferCareMeasures.cql
#   Translation failed with (5) errors; see the error log for more information.
#
# Those five were real defects. So the path filter below is earned rather than
# assumed. The original guardrail still stands and is worth restating: do not
# add a cql path here on the belief that translation happens — confirm it from a
# log. The confirmation for THIS one is above, and re-confirming takes one run:
# grep the publisher log for "Translating CQL source".

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ig/input/**'
      - 'ig/sushi-config.yaml'
      - 'ig/ig.ini'
      - '.github/workflows/ig-publish.yml'

permissions:
  contents: read

# A new push to the same PR makes an in-flight render obsolete. Nothing here is
# deployed, so cancelling is free.
concurrency:
  group: ig-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Jekyll
        run: gem install jekyll

      # Pinned deliberately (E2b, docs/plans/repo-and-package-boundaries.md
      # §9.7) — scraped from the same constant scripts/lib/sushi-version.mjs's own
      # npx call uses, so CI and a local `npm run copy-fhir` never disagree.
      # ig.yml, deploy.yml, terminology-nightly.yml and fml-validate.yml scrape
      # the same line.
      - name: Read pinned sushi version
        id: sushi
        run: |
          version=$(sed -n "s/^export const SUSHI_VERSION = '\(.*\)'$/\1/p" scripts/lib/sushi-version.mjs)
          if [ -z "$version" ]; then
            echo "::error::could not read SUSHI_VERSION from scripts/lib/sushi-version.mjs"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install SUSHI
        run: npm install -g fsh-sushi@${{ steps.sushi.outputs.version }}

      # The bulk of the runtime is fetching FHIR packages (us.core, uv.sdc and
      # their transitive deps). Keyed on sushi-config.yaml because that is where
      # dependencies are declared; restore-keys lets an unrelated config edit
      # still start from the previous cache instead of a cold fetch.
      - name: Cache FHIR package cache
        uses: actions/cache@v4
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ hashFiles('ig/sushi-config.yaml') }}
          restore-keys: |
            fhir-packages-

      # Resolve the release tag explicitly so the jar can be cached by version.
      # Caching the "latest" URL would pin us to a stale publisher indefinitely.
      - name: Resolve IG Publisher release
        id: pub
        run: |
          tag=$(curl -sL https://api.github.com/repos/HL7/fhir-ig-publisher/releases/latest | jq -r .tag_name)
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "::error::could not resolve the latest fhir-ig-publisher release tag"
            exit 1
          fi
          echo "resolved publisher release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Cache IG Publisher jar
        id: jar
        uses: actions/cache@v4
        with:
          path: publisher.jar
          key: ig-publisher-${{ steps.pub.outputs.tag }}

      - name: Download IG Publisher
        if: steps.jar.outputs.cache-hit != 'true'
        run: curl -sL -o publisher.jar "https://github.com/HL7/fhir-ig-publisher/releases/download/${{ steps.pub.outputs.tag }}/publisher.jar"

      - name: Run IG Publisher
        working-directory: ./ig
        run: java -jar ../publisher.jar -ig . | tee publisher.log

      # The CQL gate asserts on the log rather than on qa.txt, because the
      # failure mode that actually bit this repo was SILENCE, not a bad count.
      # Drop `path-binary` from sushi-config.yaml and the publisher skips
      # input/cql without a word — no translation, no error, a green build, and
      # a published Library whose ELM is whatever was last committed. That is
      # indistinguishable from success unless something checks that the work
      # happened, so the liveness assertion below is the load-bearing half.
      #
      # Both branches were verified against real logs before this step was
      # written (#212): a run with the parameter set and broken CQL emits
      # "Translation failed with (5) errors", a run with it set and valid CQL
      # emits "CQL translation completed successfully.", and a run without it
      # emits neither. Each of the three is caught by exactly one arm here.
      - name: CQL translation gate
        if: always()
        working-directory: ./ig
        run: |
          if [ ! -f publisher.log ]; then
            echo "::error::no publisher.log — the IG Publisher did not run"
            exit 1
          fi
          # 1. Liveness: the translator must have been invoked at all.
          if ! grep -q 'Translating CQL source in folder' publisher.log; then
            # Single-quoted deliberately: in double quotes bash treats the
            # backticked `path-binary: input/cql` as a command substitution, runs
            # it, and prints the message with the one instruction the reader
            # needs removed from it. This arm has never fired, so the defect was
            # invisible — a reminder that an error path is code too.
            echo '::error::the IG Publisher never translated ig/input/cql. This is the silent-skip failure: check that `path-binary: input/cql` is still present in ig/sushi-config.yaml.'
            exit 1
          fi
          # 2. Every .cql under input/cql must have been picked up individually.
          want=$(find input/cql -name '*.cql' | wc -l | tr -d ' ')
          got=$(grep -c 'Translating CQL source in file' publisher.log || true)
          echo "CQL → files on disk=${want} translated=${got}"
          if [ "$want" != "$got" ]; then
            echo "::error::${want} .cql file(s) in ig/input/cql but the publisher translated ${got} — a file is not being picked up"
            exit 1
          fi
          # 3. Result.
          if grep -qE 'Translation failed with|CQL Processing failed with' publisher.log; then
            echo "::error::CQL translation failed — see the Library validation page in the ig-site artifact (temp/qa/Library-*-validation.html) for the messages"
            grep -E 'Translation failed with|CQL Processing failed with' publisher.log
            exit 1
          fi
          if ! grep -q 'CQL translation completed successfully' publisher.log; then
            echo "::error::the publisher neither reported CQL success nor failure — the log format may have changed; re-read it before trusting this gate"
            exit 1
          fi
          echo "CQL translation completed successfully."

      - name: QA summary report
        if: always()
        working-directory: ./ig
        run: |
          qa=output/qa.txt
          if [ ! -f "$qa" ]; then
            echo "::error::no output/qa.txt produced — the IG Publisher did not complete"
            exit 1
          fi
          # qa.txt header line format (IG Publisher 2.x): "err = N, warn = M, info = K"
          # Broken-link total is reported in the publisher log: "Broken Links: N"
          errs=$(grep -oiE 'err *= *[0-9]+' "$qa" | head -1 | grep -oE '[0-9]+')
          warns=$(grep -oiE 'warn *= *[0-9]+' "$qa" | head -1 | grep -oE '[0-9]+')
          broken=$(grep -oiE 'Broken Links: *[0-9]+' publisher.log | tail -1 | grep -oE '[0-9]+')
          echo "QA → errors=${errs:-?} warnings=${warns:-?} brokenLinks=${broken:-?}"
          {
            echo "### IG Publisher QA"
            echo ""
            echo "| Errors | Warnings | Broken links |"
            echo "|---|---|---|"
            echo "| ${errs:-?} | ${warns:-?} | ${broken:-?} |"
            echo ""
            echo "Full report (\`qa.html\`) and the rendered site are in the **ig-site** artifact."
          } >> "$GITHUB_STEP_SUMMARY"
          # Gate: fail on any IG Publisher error or broken link. The baseline is
          # 0 / 0 as of Phase 2a (#84); this guards against regressions.
          if { [ -n "$errs" ] && [ "$errs" != "0" ]; } || { [ -n "$broken" ] && [ "$broken" != "0" ]; }; then
            echo "::error::IG Publisher reported ${errs:-?} error(s) and ${broken:-?} broken link(s) — see the qa.html artifact"
            exit 1
          fi

      - name: Upload rendered site + QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ig-site
          path: |
            ig/output/qa.html
            ig/output/qa.txt
            ig/output/*.html
            ig/publisher.log
          if-no-files-found: warn
          retention-days: 14
