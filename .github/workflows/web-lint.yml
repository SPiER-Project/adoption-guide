name: Web — lint, typecheck & build

# Enforce the design-token vocabulary (no raw hex / font-size / box-shadow
# outside index.css), guard the anti-drift checks (observationExtract, stage
# ids, catalog integrity), and run TypeScript, ESLint, and a production build.
# The observationExtract check reads Questionnaires from FHIR-Resources/ at the
# repo root, so this also triggers on FHIR-Resources/** — path drift there
# (e.g. the PR #107 flattening) would otherwise slip past CI. The stage-id and
# catalog checks validate against ig/input/fsh/, so ig/** triggers too. Runs on
# every push to main and matching PRs.
#
# services/** is in the trigger list because the cds-hooks Worker imports web
# source (catalog, mappers, scenarios), so a web change can break it — and
# because until the cds-hooks job below existed, a service-only PR triggered NO
# workflow at all. Cloudflare Workers Builds does build the Worker on deploy,
# but `vite build` does not typecheck and does not run tests, so type errors and
# failing tests in the production Worker reached deploy undetected.

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'services/**'
      - 'FHIR-Resources/**'
      - 'ig/**'
      - '.github/workflows/web-lint.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'services/**'
      - 'FHIR-Resources/**'
      - 'ig/**'
      - '.github/workflows/web-lint.yml'
  workflow_dispatch:

jobs:
  # Fast feedback. Every gate here ALSO runs in the `verify` job below, which
  # calls `npm run verify` wholesale — that redundancy is deliberate, not drift.
  # These are the gates that need no `copy-fhir`, so they report in ~30s instead
  # of waiting on a SUSHI compile. Deleting this job would lose nothing but
  # speed; adding a gate here that is NOT in `npm run verify` would recreate the
  # hand-copied-list problem the verify job's comment describes.
  lint-css:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint CSS
        run: npm run lint:css

      # The other half of the design-token rule. `lint:css` enforces that a
      # colour/size/shadow declaration uses `var(--…)`; it cannot tell whether
      # the token exists, so `color: var(--made-up)` passes it (issue #280).
      # Reads only web/src, so it belongs in this fast job.
      - name: Check CSS token references
        run: npm run check:tokens

      - name: Check observationExtract contract
        run: npm run check:extract

      # Reads the canonical stage list straight from ig/input/fsh/ — no
      # copy-fhir needed, so it can run in this fast job.
      - name: Check population stage ids
        run: npm run check:stages

      # Resolves scenario QuestionnaireResponses against the Questionnaires in
      # FHIR-Resources/, which are checked in — so this needs no copy-fhir
      # either and belongs in the fast job.
      #
      # The RESOURCES half of check:scenarios is deliberately NOT here: it reads
      # the generated StructureDefinitions out of web/src/data/fhir/, which only
      # exist after copy-fhir. It runs in the `verify` job below instead. (It
      # fails loudly rather than passing vacuously when they are absent, which
      # is how this split was found.)
      - name: Check scenario responses
        run: npm run check:scenarios:responses

      # Does each mapper read an answer the way its Questionnaire declares it?
      # (#327: the whole C-SSRS family read `valueBoolean` from items declared
      # `choice`, so an endorsed screen derived "no risk".) Reads the mapper
      # sources and the checked-in Questionnaires only — no copy-fhir needed,
      # so it belongs in this fast job. It fails, rather than skipping, on a
      # read it cannot resolve.
      - name: Check mapper answer readers
        run: npm run check:readers

  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # ⚠️ ONE step on purpose: `npm run verify` runs the whole gate list, the
      # same way the cds-hooks and mock-ehr jobs below do.
      #
      # This job used to hand-list its steps — copy-fhir, check:catalog,
      # check:scenarios:resources, tsc, lint, test — and that list drifted from
      # the one in package.json. EIGHT gates were only ever run locally:
      # check:template, check:patients, check:fallback, check:measures,
      # check:reassessment, check:dates, check:ucum and check:fhir-r5. All eight
      # passed, and together they take about three seconds; the cost was never
      # the reason they were missing. Nothing gated the drift, because a
      # hand-copied list has nothing to compare itself against — the same
      # failure as the stale `check:codings` floor (#232) and the "eleven drift
      # checks" prose in CLAUDE.md.
      #
      # Calling the script means a gate added to package.json is enforced here
      # automatically, and there is no second list to keep in sync. Do not
      # re-expand this into individual steps to get prettier step names.
      #
      # `verify` starts with `copy-fhir -- --force`, which generates
      # web/src/data/fhir/*.json and care-plan-profiles.generated.ts (imported
      # by src/data/catalog/stages.ts and src/lib/carePlanMappers/shared.ts), so
      # the separate copy-fhir step this job used to run is redundant — keeping
      # it would compile the FSH twice.
      - name: Verify (typecheck, lint, every check:* gate, unit tests)
        run: npm run verify

      # Not part of `verify` — a production build is a different question from
      # "is the source correct", and it is the slowest thing here.
      - name: Build
        run: npm run build

  # The CDS Hooks Worker: typecheck, lint, and unit tests. Runs as its own job
  # so a service-only change gets a signal, and so a web change that breaks the
  # Worker's imports fails here rather than at deploy time.
  cds-hooks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/cds-hooks

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The service's `pretest` shells out to `npm --prefix ../../web run
      # copy-fhir` (its tests import web's catalog and mappers), so web's
      # dependencies have to be present too.
      - name: Install web dependencies
        working-directory: ./web
        run: npm ci

      - name: Install service dependencies
        run: npm ci

      # typecheck + lint + test. `pretest` generates web/src/data/fhir/*.json
      # and care-plan-profiles.generated.ts via copy-fhir.
      - name: Verify
        run: npm run verify

  # The mock EHR Worker: typecheck, lint, and unit tests — including the
  # integration test that drives the app's real SmartDataSource against it.
  # Its own job for the same reason as cds-hooks above, and more urgently: this
  # service reads the population scenario fixtures directly, so a re-anchoring
  # by web/scripts/shift-scenario-dates.mjs (or any fixture edit) can break it
  # while every web gate stays green.
  mock-ehr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/mock-ehr

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # `pretest` shells out to `npm --prefix ../../web run copy-fhir` (the 14
      # Patient resources it serves are SUSHI output), and the integration test
      # resolves fhirclient out of web/node_modules rather than keeping a second
      # copy — so web's dependencies have to be installed too.
      - name: Install web dependencies
        working-directory: ./web
        run: npm ci

      - name: Install service dependencies
        run: npm ci

      - name: Verify
        run: npm run verify
