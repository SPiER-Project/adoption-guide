name: Web — lint, typecheck & build

# Enforce the design-token vocabulary (no raw hex / font-size / box-shadow
# outside index.css), guard the anti-drift checks (observationExtract, stage
# ids, catalog integrity), and run TypeScript, ESLint, and a production build.
# The observationExtract check reads Questionnaires from FHIR-Resources/ at the
# repo root, so this also triggers on FHIR-Resources/** — path drift there
# (e.g. the PR #107 flattening) would otherwise slip past CI. The stage-id and
# catalog checks validate against ig/input/fsh/, so ig/** triggers too. Runs on
# every push to main and matching PRs.
#
# services/** is in the trigger list because the cds-hooks Worker imports web
# source (catalog, mappers, scenarios), so a web change can break it — and
# because until the cds-hooks job below existed, a service-only PR triggered NO
# workflow at all. Cloudflare Workers Builds does build the Worker on deploy,
# but `vite build` does not typecheck and does not run tests, so type errors and
# failing tests in the production Worker reached deploy undetected.

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'services/**'
      - 'FHIR-Resources/**'
      - 'ig/**'
      - '.github/workflows/web-lint.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'services/**'
      - 'FHIR-Resources/**'
      - 'ig/**'
      - '.github/workflows/web-lint.yml'
  workflow_dispatch:

# Supersede in-flight runs for the same PR, the way ig-publish.yml and
# fml-validate.yml already do. Two PR branches were observed paying for this:
# `claude/docs-consolidation-phase-a-rebased` got two full runs 38 SECONDS apart
# (18:18:20 and 18:18:58 on 2026-09-03), and `claude/phase-c-tasks-39501e` two
# three minutes apart. Only the last commit merges, so the earlier run's jobs
# were billed for a verdict on a tree nobody would ever ship.
#
# ⚠️ `cancel-in-progress` is deliberately conditional on the event, NOT `true`.
# On a PR, an obsolete commit's verdict is worthless. On `main` it is the
# opposite: two pushes landing a minute apart (1321243/69f4df3, 43f6e89/999359f)
# would leave the first MERGED commit with a cancelled run — no verdict at all,
# which reads identically to "not yet finished" and is the sort of green-that-
# checked-nothing this repo keeps rediscovering. So main runs always complete.
concurrency:
  group: web-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast feedback. Every gate here ALSO runs in the `verify` job below, which
  # calls `npm run verify` wholesale — that redundancy is deliberate, not drift.
  # These are the gates that need no `copy-fhir`, so they report in ~30s instead
  # of waiting on a SUSHI compile. Deleting this job would lose nothing but
  # speed; adding a gate here that is NOT in `npm run verify` would recreate the
  # hand-copied-list problem the verify job's comment describes.
  lint-css:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint CSS
        run: npm run lint:css

      # The other half of the design-token rule. `lint:css` enforces that a
      # colour/size/shadow declaration uses `var(--…)`; it cannot tell whether
      # the token exists, so `color: var(--made-up)` passes it (issue #280).
      # Reads only web/src, so it belongs in this fast job.
      - name: Check CSS token references
        run: npm run check:tokens

      # The reading measure. `lint:css` and `check:tokens` between them prove a
      # cap is spelled with a real token; neither can tell whether that token is
      # a WIDTH where a character count was meant — which is what `--measure-prose`
      # was for as long as it was 760px. Reads only web/src, so it belongs here.
      - name: Check prose measure
        run: npm run check:prose

      - name: Check observationExtract contract
        run: npm run check:extract

      # Reads the canonical stage list straight from ig/input/fsh/ — no
      # copy-fhir needed, so it can run in this fast job.
      - name: Check population stage ids
        run: npm run check:stages

      # Resolves scenario QuestionnaireResponses against the Questionnaires in
      # FHIR-Resources/, which are checked in — so this needs no copy-fhir
      # either and belongs in the fast job.
      #
      # The RESOURCES half of check:scenarios is deliberately NOT here: it reads
      # the generated StructureDefinitions out of packages/fhir-artifacts/generated/, which only
      # exist after copy-fhir. It runs in the `verify` job below instead. (It
      # fails loudly rather than passing vacuously when they are absent, which
      # is how this split was found.)
      - name: Check scenario responses
        run: npm run check:scenarios:responses

      # Does each mapper read an answer the way its Questionnaire declares it?
      # (#327: the whole C-SSRS family read `valueBoolean` from items declared
      # `choice`, so an endorsed screen derived "no risk".) Reads the mapper
      # sources and the checked-in Questionnaires only — no copy-fhir needed,
      # so it belongs in this fast job. It fails, rather than skipping, on a
      # read it cannot resolve.
      - name: Check mapper answer readers
        run: npm run check:readers

  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The cache key for the generated FHIR tree, taken from the one place that
      # defines what determines that tree. `copy-fhir.mjs` is node-builtins
      # only, so this runs before any install.
      - name: Fingerprint the FHIR inputs
        id: fhir
        working-directory: ./web
        run: echo "key=$(node scripts/copy-fhir.mjs --print-input-fingerprint)" >> "$GITHUB_OUTPUT"

      # Lookup-only: this job does not restore the tree, it PRODUCES it. `verify`
      # keeps `copy-fhir -- --force`, so exactly one job per run derives the tree
      # from source with every gate then running against those fresh bytes. That
      # is the liveness half of this cache — if every job restored, an input the
      # key cannot see would let one stale tree satisfy every gate in the repo,
      # and nothing would ever notice. This step only asks whether the entry
      # already exists, so the save below can be skipped when it does.
      - name: Is this tree already cached?
        id: fhir-lookup
        uses: actions/cache/restore@v4
        with:
          path: packages/fhir-artifacts/generated
          key: fhir-generated-${{ steps.fhir.outputs.key }}
          lookup-only: true

      - name: Install dependencies
        run: npm ci

      # SUSHI downloads hl7.fhir.uv.tools.r4, hl7.terminology.r4 (4176
      # resources), us.core and uv.sdc from packages.fhir.org on every cold run,
      # and that fetch — not the compile — is the bulk of `copy-fhir`'s 40s.
      # Same key and path the ig.yml, ig-publish.yml and deploy.yml jobs already
      # use, so a PR restores what the last push to main saved.
      #
      # Safe to reuse rather than re-fetch: SUSHI still resolves the two
      # `#latest` automatic dependencies over the network each run and only
      # reads the cached copy when the concrete version matches, so a warm cache
      # cannot silently pin an older package than a cold one would.
      - name: Cache FHIR package cache
        uses: actions/cache@v4
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ hashFiles('ig/sushi-config.yaml') }}
          restore-keys: |
            fhir-packages-

      # ⚠️ ONE step on purpose: `npm run verify` runs the whole gate list, the
      # same way the cds-hooks and mock-ehr jobs below do.
      #
      # This job used to hand-list its steps — copy-fhir, check:catalog,
      # check:scenarios:resources, tsc, lint, test — and that list drifted from
      # the one in package.json. EIGHT gates were only ever run locally:
      # check:template, check:patients, check:fallback, check:measures,
      # check:reassessment, check:dates, check:ucum and check:fhir-r5. All eight
      # passed, and together they take about three seconds; the cost was never
      # the reason they were missing. Nothing gated the drift, because a
      # hand-copied list has nothing to compare itself against — the same
      # failure as the stale `check:codings` floor (#232) and the "eleven drift
      # checks" prose in CLAUDE.md.
      #
      # Calling the script means a gate added to package.json is enforced here
      # automatically, and there is no second list to keep in sync. Do not
      # re-expand this into individual steps to get prettier step names.
      #
      # `verify` starts with `copy-fhir -- --force`, which generates
      # packages/fhir-artifacts/generated/*.json and care-plan-profiles.generated.ts (imported
      # by src/data/catalog/stages.ts and src/lib/carePlanMappers/shared.ts), so
      # the separate copy-fhir step this job used to run is redundant — keeping
      # it would compile the FSH twice.
      - name: Verify (typecheck, lint, every check:* gate, unit tests)
        run: npm run verify

      # After the gates, never with `if: always()` — the same rule deploy.yml's
      # render cache follows. A tree that failed a gate must not become the
      # cached answer for its inputs. Explicit `cache/save` rather than the
      # combined `actions/cache` action for exactly that reason: the latter's
      # post-step saves even when a later step failed.
      #
      # One entry per fingerprint, and no `github.run_id` suffix. deploy.yml
      # needs the run id because its key cannot see `fhir.base.template#current`
      # moving, so the newest render has to win a prefix match. Here the key
      # fully determines the content, so a second entry for the same key could
      # only be a duplicate.
      - name: Cache the generated FHIR tree
        if: steps.fhir-lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: packages/fhir-artifacts/generated
          key: fhir-generated-${{ steps.fhir.outputs.key }}

      # Not part of `verify` — a production build is a different question from
      # "is the source correct", and it is the slowest thing here.
      - name: Build
        run: npm run build

  # The CDS Hooks Worker: typecheck, lint, and unit tests. Runs as its own job
  # so a service-only change gets a signal, and so a web change that breaks the
  # Worker's imports fails here rather than at deploy time.
  cds-hooks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/cds-hooks

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            services/cds-hooks/package-lock.json

      # The cache key for the generated FHIR tree — one definition, in
      # copy-fhir.mjs. Node-builtins only, so it needs no install.
      - name: Fingerprint the FHIR inputs
        id: fhir
        working-directory: ./web
        run: echo "key=$(node scripts/copy-fhir.mjs --print-input-fingerprint)" >> "$GITHUB_OUTPUT"

      # Restoring the tree lets this job's `copy-fhir` skip the SUSHI compile —
      # but nothing here TRUSTS the restored bytes. `copy-fhir` re-reads the
      # manifest inside them and recomputes both the input and the output
      # fingerprint; a truncated, tampered or partial entry fails that and
      # recompiles. A bad cache therefore degrades this job to slow, never to
      # wrong, which is why it needs no separate completeness gate of the kind
      # deploy.yml's render cache does require.
      #
      # Written by the `verify` job, which compiles unconditionally. On a PR the
      # hit comes from the last push to main; a PR that edits any FSH or
      # Questionnaire input changes the fingerprint and these jobs compile, which
      # is the correct answer rather than a miss to be tuned away.
      - name: Restore the generated FHIR tree
        uses: actions/cache/restore@v4
        with:
          path: packages/fhir-artifacts/generated
          key: fhir-generated-${{ steps.fhir.outputs.key }}

      # The service's `pretest` shells out to `npm --prefix ../../web run
      # copy-fhir` (its tests import web's catalog and mappers), so web's
      # dependencies have to be present too.
      - name: Install web dependencies
        working-directory: ./web
        run: npm ci

      - name: Install service dependencies
        run: npm ci

      # SUSHI downloads hl7.fhir.uv.tools.r4, hl7.terminology.r4 (4176
      # resources), us.core and uv.sdc from packages.fhir.org on every cold run,
      # and that fetch — not the compile — is the bulk of `copy-fhir`'s 40s.
      # Same key and path the ig.yml, ig-publish.yml and deploy.yml jobs already
      # use, so a PR restores what the last push to main saved.
      #
      # Safe to reuse rather than re-fetch: SUSHI still resolves the two
      # `#latest` automatic dependencies over the network each run and only
      # reads the cached copy when the concrete version matches, so a warm cache
      # cannot silently pin an older package than a cold one would.
      - name: Cache FHIR package cache
        uses: actions/cache@v4
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ hashFiles('ig/sushi-config.yaml') }}
          restore-keys: |
            fhir-packages-

      # typecheck + lint + test. `pretest` generates packages/fhir-artifacts/generated/*.json
      # and care-plan-profiles.generated.ts via copy-fhir.
      - name: Verify
        run: npm run verify

  # The mock EHR Worker: typecheck, lint, and unit tests — including the
  # integration test that drives the app's real SmartDataSource against it.
  # Its own job for the same reason as cds-hooks above, and more urgently: this
  # service reads the population scenario fixtures directly, so a re-anchoring
  # by web/scripts/shift-scenario-dates.mjs (or any fixture edit) can break it
  # while every web gate stays green.
  mock-ehr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/mock-ehr

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            services/mock-ehr/package-lock.json

      # The cache key for the generated FHIR tree — one definition, in
      # copy-fhir.mjs. Node-builtins only, so it needs no install.
      - name: Fingerprint the FHIR inputs
        id: fhir
        working-directory: ./web
        run: echo "key=$(node scripts/copy-fhir.mjs --print-input-fingerprint)" >> "$GITHUB_OUTPUT"

      # Restoring the tree lets this job's `copy-fhir` skip the SUSHI compile —
      # but nothing here TRUSTS the restored bytes. `copy-fhir` re-reads the
      # manifest inside them and recomputes both the input and the output
      # fingerprint; a truncated, tampered or partial entry fails that and
      # recompiles. A bad cache therefore degrades this job to slow, never to
      # wrong, which is why it needs no separate completeness gate of the kind
      # deploy.yml's render cache does require.
      #
      # Written by the `verify` job, which compiles unconditionally. On a PR the
      # hit comes from the last push to main; a PR that edits any FSH or
      # Questionnaire input changes the fingerprint and these jobs compile, which
      # is the correct answer rather than a miss to be tuned away.
      - name: Restore the generated FHIR tree
        uses: actions/cache/restore@v4
        with:
          path: packages/fhir-artifacts/generated
          key: fhir-generated-${{ steps.fhir.outputs.key }}

      # `pretest` shells out to `npm --prefix ../../web run copy-fhir` (the 14
      # Patient resources it serves are SUSHI output), and the integration test
      # resolves fhirclient out of web/node_modules rather than keeping a second
      # copy — so web's dependencies have to be installed too.
      - name: Install web dependencies
        working-directory: ./web
        run: npm ci

      - name: Install service dependencies
        run: npm ci

      # SUSHI downloads hl7.fhir.uv.tools.r4, hl7.terminology.r4 (4176
      # resources), us.core and uv.sdc from packages.fhir.org on every cold run,
      # and that fetch — not the compile — is the bulk of `copy-fhir`'s 40s.
      # Same key and path the ig.yml, ig-publish.yml and deploy.yml jobs already
      # use, so a PR restores what the last push to main saved.
      #
      # Safe to reuse rather than re-fetch: SUSHI still resolves the two
      # `#latest` automatic dependencies over the network each run and only
      # reads the cached copy when the concrete version matches, so a warm cache
      # cannot silently pin an older package than a cold one would.
      - name: Cache FHIR package cache
        uses: actions/cache@v4
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ hashFiles('ig/sushi-config.yaml') }}
          restore-keys: |
            fhir-packages-

      - name: Verify
        run: npm run verify
