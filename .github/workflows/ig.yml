name: IG — Sushi compile + validate

# Compile the FSH IG with Sushi on every push touching ig/ and on every PR, then
# run the official HL7 validator over every generated *and* hand-authored FHIR
# resource.
#
# The full IG Publisher run lives in `ig-publish.yml` — it pulls ~500MB of
# dependencies plus Jekyll and takes ~10 minutes, and it is the only check that
# evaluates FHIRPath invariants and narrative link integrity. It is deliberately
# NOT duplicated here.
#
# The two are complementary, not redundant:
#   - ig-publish.yml is triggered by `ig/**` only, and gates on a coarse
#     `err = N` / `Broken Links: N` parse of qa.txt.
#   - this workflow additionally covers `FHIR-Resources/**` — the hand-authored
#     Questionnaires the app imports at runtime, which nothing validated at all
#     before — and `packages/demo-population/src/scenarios/**`, the demo registry's
#     hand-authored FHIR, which the Stage-8 measure engine reads (#226). It
#     reports per-resource conformance with inline PR annotations.

on:
  push:
    branches:
      - main
    paths:
      - 'ig/**'
      - 'FHIR-Resources/**'
      - 'packages/demo-population/src/scenarios/**'
      - 'scripts/validate-fhir.mjs'
      - 'web/scripts/check-concept-crosswalk.mjs'
      # The runtime corpus (#302) is produced by the app's own builders, so a
      # builder change has to re-run the validator. Without these the gate would
      # exist but sit idle exactly when the code it protects moves.
      - 'web/src/lib/**'
      - 'web/src/types/**'
      - 'web/package.json'
      - 'web/scripts/copy-fhir.mjs'
      - '.github/workflows/ig.yml'
  pull_request:
    paths:
      - 'ig/**'
      - 'FHIR-Resources/**'
      - 'packages/demo-population/src/scenarios/**'
      - 'scripts/validate-fhir.mjs'
      - 'web/scripts/check-concept-crosswalk.mjs'
      # The runtime corpus (#302) is produced by the app's own builders, so a
      # builder change has to re-run the validator. Without these the gate would
      # exist but sit idle exactly when the code it protects moves.
      - 'web/src/lib/**'
      - 'web/src/types/**'
      - 'web/package.json'
      - 'web/scripts/copy-fhir.mjs'
      - '.github/workflows/ig.yml'
  workflow_dispatch:

jobs:
  sushi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ig

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Sushi
        run: npm install -g fsh-sushi

      # Tee'd so the next step can gate the SHAPE of SUSHI's warnings. The
      # capture is scoped to this one command on purpose: the `npm install -g
      # fsh-sushi` step above prints its own `npm warn deprecated …` lines, and
      # a whole-job grep for "warn" false-positives on every one of them.
      # GitHub's default shell runs with pipefail, so a failing compile still
      # fails this step rather than being masked by tee.
      - name: Compile FSH
        run: sushi . 2>&1 | tee sushi-output.log

      # #273: "SUSHI is quiet" stopped being a usable signal when #271 took the
      # repo from 0 to 31 expected advisory warnings — the 32nd, real one now
      # arrives invisible in that field. This asserts the SHAPE of every warning
      # against a reasoned allowlist, never a count: pinning the number would
      # churn on each new example Instance and train people to bump it without
      # reading it, which is what a stale check:codings floor already did (#232).
      # It also reconciles its own parse against SUSHI's summary, so a change to
      # SUSHI's output format fails loudly instead of passing vacuously.
      - name: Gate the shape of SUSHI's warnings
        working-directory: ${{ github.workspace }}
        run: node scripts/check-sushi-output.mjs ig/sushi-output.log

      - name: Check concept-layer crosswalks
        working-directory: ${{ github.workspace }}
        run: node web/scripts/check-concept-crosswalk.mjs

      - name: Upload generated resources
        uses: actions/upload-artifact@v4
        with:
          name: fsh-generated
          path: ig/fsh-generated/
          if-no-files-found: error
          retention-days: 14

  # Resource-level FHIR conformance. SUSHI reports 0 errors on resources the
  # HL7 validator rejects — cardinality, extension context, required-item and
  # local-terminology violations are all invisible to it.
  validate:
    name: FHIR resource validation
    needs: sushi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Reuse the compile from the `sushi` job rather than paying for it twice.
      - name: Download generated resources
        uses: actions/download-artifact@v4
        with:
          name: fsh-generated
          path: ig/fsh-generated/

      # The validator jar is ~190MB. Keyed on the version pinned in
      # scripts/lib/validator-jar.mjs — shared with check-fml.mjs since #92/#229,
      # so both gates judge resources with the same validator. The empty-version
      # guard below is load-bearing: it is what caught the constant moving out
      # of validate-fhir.mjs. terminology-nightly.yml scrapes the same line.
      - name: Read pinned validator version
        id: validator
        run: |
          version=$(sed -n "s/^export const VALIDATOR_VERSION = '\(.*\)'$/\1/p" scripts/lib/validator-jar.mjs)
          if [ -z "$version" ]; then
            echo "::error::could not read VALIDATOR_VERSION from scripts/lib/validator-jar.mjs"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache validator jar
        uses: actions/cache@v4
        with:
          path: .fhir-validator
          key: fhir-validator-${{ steps.validator.outputs.version }}

      # Same cache the IG Publisher job uses: us.core, uv.sdc and their
      # transitive deps, keyed on where those dependencies are declared.
      - name: Cache FHIR package cache
        uses: actions/cache@v4
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ hashFiles('ig/sushi-config.yaml') }}
          restore-keys: |
            fhir-packages-

      # #302: the FHIR the APP emits was gated by nothing. The emitter runs the
      # real production builders (vitest is the only TS runtime in this package)
      # and writes to web/.runtime-fhir, which the validator then reads via
      # --also. On its first run this found 118 errors, including every profile's
      # required concept-domain category missing from every builder.
      - name: Install web dependencies
        run: npm ci
        working-directory: ./web

      # The emitter imports the generated CodeSystems out of web/src/data/fhir/,
      # which is gitignored. `--no-compile` copies the fsh-generated artifact
      # downloaded above instead of re-running sushi — this job already exists to
      # avoid paying for that compile twice.
      - name: Copy generated FHIR into the web app
        run: npm run copy-fhir -- --no-compile
        working-directory: ./web

      - name: Emit the runtime FHIR corpus
        run: npm run emit:runtime-fhir
        working-directory: ./web

      - name: Validate FHIR resources
        run: node scripts/validate-fhir.mjs --also web/.runtime-fhir
