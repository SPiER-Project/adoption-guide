name: Roadmap — weekly snapshot refresh

# The Roadmap page (/guide/roadmap) reads a *committed* snapshot at
# web/src/data/roadmap.generated.json so the site always builds offline. Nothing
# kept that snapshot in sync with GitHub Issues, and Roadmap.tsx derives each
# tool's displayed build status from the snapshot's `status:` labels and renders
# an excerpt of each issue's body — so label and body drift are both visible on
# a published page (see issue #122).
#
# This workflow re-runs the fetch weekly and opens a PR when the *content*
# changed. It deliberately does not commit on its own: the snapshot feeds a
# published page, so a human sees the diff first.
#
# Three things worth knowing before you edit it:
#
# 1. Two timestamps move on their own and neither means the page changed:
#    `fetchedAt` is rewritten on every single run, and each issue's `updatedAt`
#    bumps on any activity including a comment. Both are normalized out of the
#    drift key (see FINGERPRINT below) — when they are the only difference the
#    file is reverted and the run is a green no-op. Consequence: the page's
#    "snapshot fetched at" means "content captured at", not "last checked".
#
# 2. No `npm ci`. fetch-roadmap.mjs uses only Node builtins plus global fetch,
#    so setup-node alone is the whole install.
#
# 3. The org forbids GitHub Actions from creating pull requests
#    (`can_approve_pull_request_reviews: false`, enforced org-wide and not
#    overridable per-repo) — but this workflow is NOT blocked by that today. The
#    repo carries a fine-grained PAT with contents+pull-requests write as the
#    secret ROADMAP_PR_TOKEN, added 2026-08-08, and every step below prefers it
#    over GITHUB_TOKEN. Runs 31282321253 and 31282716568 opened PRs #243 and
#    #244 themselves that evening, with the blocked-path step skipped. The PAT
#    also gets the drift PR its checks: pushes made with GITHUB_TOKEN do not
#    trigger other workflows, so under the old path the snapshot PR was reviewed
#    with none.
#
#    What to expect when the PAT expires — the failure mode that remains, since
#    GitHub exposes no expiry date for a secret and nothing here can warn you:
#    the token silently falls back to GITHUB_TOKEN, org policy refuses the PR,
#    and the branch is still pushed while the job stays green. That stays green
#    *only* for that specific refusal; any other `gh pr create` failure fails the
#    job. A blocked run also files a reusable tracking issue rather than only
#    warning into a run summary — added in #232, which found a green run on
#    2026-08-07 that had silently not opened its PR: the graceful handling was
#    working exactly as designed and was still indistinguishable, from outside,
#    from a run with nothing to do. That fallback is now a regression detector
#    for an expired PAT. Do not remove it because the happy path works.
#
#    The alternative permanent fix is the org checkbox (Org Settings → Actions →
#    General), which needs no rotation but costs the PR its checks. See
#    docs/scheduled-checks-triage.md.

on:
  schedule:
    # Mondays 13:17 UTC — off the hour, where the scheduler is less congested.
    - cron: '17 13 * * 1'
  workflow_dispatch:

# The repo default is read-only, so these have to be requested explicitly.
#
# `issues: read` is load-bearing and easy to lose: declaring a `permissions:`
# block at all resets every *unlisted* scope to `none`, and GITHUB_TOKEN without
# issues access does not get a 403 from /repos/{owner}/{repo}/issues — it gets
# HTTP 200 and an empty array. The first dispatched run of this workflow (run
# 31025525042) omitted it and cheerfully fetched 0 issues; only the sanity check
# below stopped it from proposing a PR that emptied the published roadmap.
permissions:
  contents: write
  # `read` fetches the roadmap; `write` is what lets the blocked-PR fallback below
  # file its tracking issue. Actions are forbidden from opening pull requests in
  # this org, but not from opening issues — terminology-nightly.yml relies on the
  # same distinction.
  issues: write
  pull-requests: write

concurrency:
  group: roadmap-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SNAPSHOT: web/src/data/roadmap.generated.json
      BRANCH: chore/roadmap-snapshot
      # The drift key. Used for both the before and after fingerprints, so the
      # later diff-summary step inherits the same normalization for free.
      FINGERPRINT: '{repo, issues: (.issues | map(del(.updatedAt)))}'

    steps:
      - uses: actions/checkout@v4
        with:
          # Same token that pushes the branch below, so checkout persists
          # credentials that can write.
          token: ${{ secrets.ROADMAP_PR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Content fingerprint before the fetch, key-sorted so formatting can never
      # register as drift. Two fields are normalized out — see note 1 above for
      # `fetchedAt`, and note that `updatedAt` is typed in Roadmap.tsx but never
      # rendered (only `closedAt` is), so a single comment on any issue would
      # otherwise bump it and open a PR containing nothing user-visible. The
      # committed file keeps both fields; they just don't get a vote on drift.
      - name: Record snapshot content before fetch
        run: jq -S "$FINGERPRINT" "$SNAPSHOT" > "$RUNNER_TEMP/before.json"

      # Best-effort by design: the script preserves the prior snapshot when
      # GitHub is unreachable, which then reads here as "no drift".
      - name: Fetch roadmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node web/scripts/fetch-roadmap.mjs

      # Guard against a "successful" fetch that returned nothing, or far less
      # than it should have. fetch-roadmap.mjs treats an empty first page as a
      # normal result, so an API that answers 200-with-[] (see the permissions
      # note above) reaches this point looking like a legitimate refresh. Without
      # these checks it would open a PR that empties the published page.
      - name: Sanity-check the new snapshot
        run: |
          if ! jq -e '.' "$SNAPSHOT" > /dev/null; then
            echo "::error::$SNAPSHOT is not valid JSON after the fetch."
            exit 1
          fi
          if jq -e 'has("error")' "$SNAPSHOT" > /dev/null; then
            echo "::error::snapshot carries an error field: $(jq -r '.error' "$SNAPSHOT")"
            exit 1
          fi
          count=$(jq '.issues | length' "$SNAPSHOT")
          if [ "$count" -lt 1 ]; then
            echo "::error::fetch produced $count issues — refusing to propose an empty snapshot."
            exit 1
          fi
          # A partial failure (scoped token, mid-pagination outage) can return
          # *some* issues and still clear the >0 check, so also refuse an
          # implausible drop. Issues are essentially never deleted here; the 10%
          # slack covers the occasional transfer out of the repo. A legitimate
          # larger drop needs a manual `npm run fetch-roadmap` and a hand-checked
          # commit — deliberately, because it means the page loses content.
          prior=$(jq '.issues | length' "$RUNNER_TEMP/before.json")
          floor=$(( prior * 9 / 10 ))
          if [ "$count" -lt "$floor" ]; then
            echo "::error::fetch produced $count issues but the committed snapshot has $prior (floor $floor) — refusing a suspicious mass loss."
            exit 1
          fi
          echo "snapshot holds $count issue(s); prior snapshot had $prior"

      - name: Detect content drift
        id: drift
        run: |
          jq -S "$FINGERPRINT" "$SNAPSHOT" > "$RUNNER_TEMP/after.json"
          if diff -q "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/after.json" > /dev/null; then
            # Only the normalized-out timestamps moved — drop the churn so git
            # history stays clean.
            git checkout -- "$SNAPSHOT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report no-op
        if: steps.drift.outputs.changed == 'false'
        run: |
          {
            echo "### Roadmap snapshot is current"
            echo
            echo "The tracker matches \`$SNAPSHOT\` (\`$(jq '.issues | length' "$SNAPSHOT")\` issues). No PR opened."
          } >> "$GITHUB_STEP_SUMMARY"

      # Which issues moved, so the reviewer can see the shape of the drift
      # without reading a 3000-line JSON diff.
      - name: Summarize the drift
        if: steps.drift.outputs.changed == 'true'
        run: |
          jq -rn \
            --slurpfile a "$RUNNER_TEMP/before.json" \
            --slurpfile b "$RUNNER_TEMP/after.json" '
            def listing($nums):
              ($nums | length) as $n
              | if $n > 25
                then "\($n) — \($nums[0:25] | map("#\(.)") | join(", ")) … and \($n - 25) more"
                else "\($n) — \($nums | map("#\(.)") | join(", "))"
                end;
            def section($label; $nums):
              if ($nums | length) == 0 then empty
              else "- **\($label):** \(listing($nums))" end;
            ($a[0].issues | INDEX(.number | tostring)) as $A
            | ($b[0].issues | INDEX(.number | tostring)) as $B
            | ([$B | keys_unsorted[] | select($A[.] == null) | tonumber] | sort) as $added
            | ([$A | keys_unsorted[] | select($B[.] == null) | tonumber] | sort) as $removed
            | ([$A | keys_unsorted[]
                 | select($B[.] != null and $B[.] != $A[.]) | tonumber] | sort) as $changed
            | [ section("New issues"; $added),
                section("No longer returned by the tracker"; $removed),
                section("Updated (labels, title, state, or body)"; $changed) ]
            | join("\n")
          ' > "$RUNNER_TEMP/drift.md"

          {
            echo "The weekly roadmap fetch found drift between GitHub Issues and the"
            echo "committed snapshot at \`$SNAPSHOT\`."
            echo
            cat "$RUNNER_TEMP/drift.md"
            echo
            echo "Labels drive the build status each tool renders with on \`/guide/roadmap\`, and"
            echo "issue bodies are excerpted there, so both kinds of drift are user-visible."
            echo
            echo "Opened by [\`roadmap-snapshot.yml\`](../blob/main/.github/workflows/roadmap-snapshot.yml)"
            echo "— run [\`$GITHUB_RUN_ID\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo "Refs #122."
            echo
            echo "> Checks run on this PR only because the push used the \`ROADMAP_PR_TOKEN\` PAT."
            echo "> If it arrives with **no checks at all**, that PAT expired and the run fell back"
            echo "> to \`GITHUB_TOKEN\`, whose pushes trigger no other workflows — rotate it, and"
            echo "> push an empty commit here to get this PR verified."
          } > "$RUNNER_TEMP/pr-body.md"

          {
            echo "### Roadmap snapshot drifted"
            echo
            cat "$RUNNER_TEMP/drift.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push the refreshed snapshot
        if: steps.drift.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCH"
          git add "$SNAPSHOT"
          git commit -m 'chore: refresh roadmap snapshot from GitHub Issues' \
                     -m "Regenerated by .github/workflows/roadmap-snapshot.yml (run $GITHUB_RUN_ID). Refs #122."
          # This branch is machine-owned and always rebuilt from main, so a plain
          # force-push is correct — there is never a human commit to lose.
          git push --force origin "$BRANCH"

      - name: Open or update the drift PR
        id: pr
        if: steps.drift.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.ROADMAP_PR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file "$RUNNER_TEMP/pr-body.md"
            echo "Updated existing PR #$existing." >> "$GITHUB_STEP_SUMMARY"
            echo "blocked=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh pr create --base main --head "$BRANCH" \
               --title 'chore: refresh roadmap snapshot from GitHub Issues' \
               --body-file "$RUNNER_TEMP/pr-body.md" 2> "$RUNNER_TEMP/pr-err.txt"; then
            echo "blocked=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat "$RUNNER_TEMP/pr-err.txt"

          # The one tolerated failure: org policy forbidding Actions from
          # opening PRs. The branch is pushed, so the work is not lost.
          if grep -qi 'not permitted to create or approve pull requests' "$RUNNER_TEMP/pr-err.txt"; then
            compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1"
            echo "::warning::GitHub Actions may not open PRs in this org. Branch $BRANCH is pushed — open the PR manually."
            {
              echo
              echo "Branch \`$BRANCH\` is pushed, but this org forbids GitHub Actions from opening"
              echo "pull requests. **[Open the PR manually]($compare)**, then rotate the expired"
              echo "\`ROADMAP_PR_TOKEN\` — reaching this path means the PAT is gone."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::gh pr create failed for an unexpected reason (see the output above)."
          exit 1

      # ─── The blocked-PR case, made visible ───────────────────
      #
      # Until now the branch above was the entire output of a blocked run: pushed,
      # warned about in a step summary, and exit 0 GREEN. Issue #232 caught what
      # that costs — a fully green run on 2026-08-07 had silently not opened its
      # PR, and a stale snapshot on a published page produces no signal anyone
      # sees. A warning inside a green run nobody opens is not a signal.
      #
      # So the fallback files an issue instead. One reusable issue, matched on
      # exact title, so a policy that stays in place does not produce a new issue
      # every Monday. This is the same shape as terminology-nightly.yml's report
      # job, and rests on the same distinction: the org blocks Actions from
      # opening *pull requests*, not issues.
      #
      # The run still exits 0. Org policy is a fact about the org, not a defect in
      # this repo, and a red build nobody can fix by editing the repo is how a
      # check trains people to ignore it. The issue is the durable signal; green
      # here means "the snapshot work completed", which it did.
      #
      # Since 2026-08-08 this is the regression detector rather than the normal
      # path: ROADMAP_PR_TOKEN makes the happy path work, so reaching here means
      # the PAT expired (or was revoked) and the run fell back to GITHUB_TOKEN.
      # That is the whole reason to keep the step — GitHub exposes no expiry date
      # for a secret, so this issue is the only notice anyone gets.
      - name: File the manual-PR tracking issue
        if: steps.pr.outputs.blocked == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'Roadmap snapshot: branch pushed, PR needs opening by hand'
        run: |
          compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "\`roadmap-snapshot.yml\` found drift and pushed \`$BRANCH\`, but this org"
            echo "forbids GitHub Actions from opening pull requests, so the PR was not created."
            echo
            echo "**This worked automatically until now.** The \`ROADMAP_PR_TOKEN\` PAT is what"
            echo "made it work, so seeing this issue at all means that token expired or was"
            echo "revoked and the run fell back to \`GITHUB_TOKEN\`. Rotating it is the fix."
            echo
            echo "**→ [Open the PR]($compare)**"
            echo
            cat "$RUNNER_TEMP/drift.md"
            echo
            echo "Until that PR merges, \`/guide/roadmap\` keeps rendering the older snapshot —"
            echo "issue labels drive each tool's displayed build status and bodies are excerpted,"
            echo "so the drift above is user-visible on a published page."
            echo
            echo "### Making this stop"
            echo
            echo "1. Reissue the fine-grained PAT with \`contents:write\` + \`pull-requests:write\`"
            echo "   and set it as the \`ROADMAP_PR_TOKEN\` secret again — this workflow prefers"
            echo "   it with no code change, and it is what gets this PR its checks (a push made"
            echo "   with \`GITHUB_TOKEN\` triggers no other workflows). Record the new expiry"
            echo "   date in \`docs/scheduled-checks-triage.md\` while you have it."
            echo "2. Or remove the dependency entirely: Org Settings → Actions → General →"
            echo "   **Allow GitHub Actions to create and approve pull requests**. One checkbox,"
            echo "   nothing to rotate — but then the PR arrives with no checks on it. This is an"
            echo "   org-level setting, though the repo maintainer currently holds org admin."
            echo
            echo "This issue is reused, not reopened per run, and closes itself once a run"
            echo "manages to open its own PR. Background and the wider triage path for both"
            echo "scheduled checks: [\`docs/scheduled-checks-triage.md\`](../blob/main/docs/scheduled-checks-triage.md)."
            echo
            echo "Refreshed by [run \`$GITHUB_RUN_ID\`]($run_url). Refs #122, #232."
          } > "$RUNNER_TEMP/issue-body.md"

          number=$(gh issue list --state open --limit 100 --json number,title \
                     --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/issue-body.md" \
              && echo "Refreshed tracking issue #$number." >> "$GITHUB_STEP_SUMMARY"
          else
            gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/issue-body.md" \
              && echo "Filed a tracking issue." >> "$GITHUB_STEP_SUMMARY"
          fi || {
            # If issues are blocked too, the step summary is all that is left —
            # say so loudly rather than letting a second silent failure stack up.
            echo "::error::could not file the manual-PR tracking issue, and the PR was already blocked."
            echo "::error::this run produced NO durable signal — open $compare by hand."
            exit 1
          }

      # Close the loop, so a fixed policy does not leave a stale issue asking for a
      # PR that already exists. Runs on the no-drift path too (where `blocked` is
      # empty): if the snapshot no longer drifts, the manual PR was merged.
      - name: Close the manual-PR tracking issue
        if: steps.pr.outputs.blocked != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'Roadmap snapshot: branch pushed, PR needs opening by hand'
        run: |
          number=$(gh issue list --state open --limit 100 --json number,title \
                     --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          [ -n "$number" ] || exit 0
          gh issue close "$number" \
            --comment "Run $GITHUB_RUN_ID no longer needs a hand-opened PR. Closing." \
            || echo "::warning::could not close tracking issue #$number."
