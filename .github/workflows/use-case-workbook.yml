name: Use-case workbook — freshness and demo linkage

# The HL7 BH working group's deliverable is a spreadsheet, and spreadsheets are
# where hand-maintained data goes to drift. This job runs the generator's
# --check, which asserts three separate things:
#
#   1. the committed .xlsx and .csv are exactly what the source JSON produces;
#   2. every event step has all eight columns — including the EHR-S FM column
#      that was empty in all 27 rows of the workbook originally circulated;
#   3. the scenario's declared linkage to the demo walkthroughs (patient-011
#      through patient-014) is true in both directions;
#   4. no `status:planned` claim or gating-tool entry names a tool the app can
#      already launch (#341) — which is why the catalog and the router are in
#      the path filter below: a renamed route changes the answer.
#
# This gate really does rebuild and byte-diff, rather than comparing a recorded
# hash. The writer in scripts/lib/xlsx-writer.mjs stores every ZIP entry
# uncompressed with a fixed timestamp precisely so that comparison is
# meaningful. If you ever make it deflate, this gate starts flaking against
# zlib versions.
#
# Needs no npm install: the script and its two helpers use Node builtins only,
# so this stays a sub-second job on a bare checkout.
#
# The path filter includes the population scenarios, because half of what this
# gate covers lives there — an edit to a walkthrough can break the linkage
# without anything under docs/ changing. It was pinned to patient-011 alone
# while three more ED patients (012–014) had joined the linkage, so an edit to
# any of those three skipped this job entirely. web-lint.yml also triggers on
# web/**, but it does not run this script.

on:
  push:
    branches:
      - main
    paths:
      - 'docs/use-cases/**'
      - 'scripts/build-use-case-workbook.mjs'
      - 'scripts/lib/xlsx-writer.mjs'
      - 'scripts/lib/crc32.mjs'
      - 'packages/demo-population/src/scenarios/patient-01*.json'
      - 'packages/core/src/data/catalog/tool-ui-metadata.ts'
      - 'web/src/App.tsx'
      - '.github/workflows/use-case-workbook.yml'
  pull_request:
    paths:
      - 'docs/use-cases/**'
      - 'scripts/build-use-case-workbook.mjs'
      - 'scripts/lib/xlsx-writer.mjs'
      - 'scripts/lib/crc32.mjs'
      - 'packages/demo-population/src/scenarios/patient-01*.json'
      - 'packages/core/src/data/catalog/tool-ui-metadata.ts'
      - 'web/src/App.tsx'
      - '.github/workflows/use-case-workbook.yml'
  workflow_dispatch:

jobs:
  freshness:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the use-case workbooks match their source
        run: node scripts/build-use-case-workbook.mjs --check
