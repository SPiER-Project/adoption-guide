name: One-pager — PDF freshness

# The outreach one-pager is a hand-designed print document whose PDF is the
# thing that actually reaches prospective sites. It has no build step, so before
# this gate existed the HTML and the PDF could disagree indefinitely — and did:
# PR #276 reworded both pages of the HTML and the committed PDF kept the retired
# "Suicide Prevention in Electronic Records" wording for three days, surfacing
# only because an unrelated text search ran over the repo.
#
# This job checks that the committed PDF is the file `build-onepager.mjs`
# produced from the committed HTML, by comparing both against the hashes in
# docs/outreach/onepager.build.json.
#
# ⚠️ It does NOT render anything, and must not start doing so. Chrome's PDF
# output is not byte-reproducible across versions (the same HTML gave 196200
# bytes under Skia/PDF m150 and 196076 under m151), so a re-render-and-compare
# gate would go red on every runner-image bump. The script's header explains the
# full reasoning; the structural assertions that DO need a browser — 2 pages,
# letter MediaBox, Poppins embedded in four weights — run at export time on the
# developer's machine, and the resulting bytes are pinned by hash here.
#
# Needs no npm install: the script uses only Node builtins, deliberately, so
# this stays a sub-second job and works on a bare checkout.
#
# Path filters matter here. web-lint.yml triggers on web/**, so a change to the
# PDF under web/public/ already runs that workflow — but docs/** triggers
# nothing else in this repo, which is precisely how a source-only edit slipped
# through before.

on:
  push:
    branches:
      - main
    paths:
      - 'docs/outreach/**'
      - 'web/public/SPiER-Overview-Care-Pathway.pdf'
      - 'scripts/build-onepager.mjs'
      - '.github/workflows/onepager.yml'
  pull_request:
    paths:
      - 'docs/outreach/**'
      - 'web/public/SPiER-Overview-Care-Pathway.pdf'
      - 'scripts/build-onepager.mjs'
      - '.github/workflows/onepager.yml'
  workflow_dispatch:

jobs:
  freshness:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the one-pager PDF matches its HTML source
        run: node scripts/build-onepager.mjs --check
